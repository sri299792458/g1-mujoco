[project]
name = "g1-mujoco"
version = "0.1.0"
description = "A Unitree SDK2-connected G1 and Dex3 simulator with OpenHomie balance control"
readme = "README.md"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10,<3.12"
dependencies = [
  "mujoco==3.3.7",
  "numpy==1.26.4",
  "onnxruntime==1.22.1",
  "unitree-sdk2py @ git+https://github.com/lnotspotl/unitree_sdk2_python.git@7c661d27f4ae064ffd0dd633fd9d5b518ef0b508",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.3"]

[tool.uv]
package = false
# Shared dependency versions from g1-dex3-tabletop cf1b27704c82d877d23ff5a3c157df3218f02402.
constraint-dependencies = [
  "click==8.4.2",
  "colorama==0.4.6",
  "cyclonedds==0.10.2",
  "exceptiongroup==1.3.1",
  "fsspec==2026.7.0",
  "iniconfig==2.3.0",
  "markdown-it-py==4.2.0",
  "mdurl==0.1.2",
  "mpmath==1.3.0",
  "opencv-python==4.11.0.86",
  "packaging==26.3",
  "pluggy==1.6.0",
  "pygame==2.6.1",
  "pygments==2.20.0",
  "rich==15.0.0",
  "rich-click==1.9.8",
  "sympy==1.14.0",
  "tomli==2.4.1",
  "typing-extensions==4.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
